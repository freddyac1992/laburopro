name: QA

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic-qa:
    name: Lint, typecheck, build, HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://gxaqrwrqlwvgrjhmfhti.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_lMgB150gcABG_YgaNVTU8A_XEy1JNi5' }}
      NEXT_TELEMETRY_DISABLED: '1'
      QA_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required environment
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- --port 3000 > /tmp/laburopro-next.log 2>&1 &
          echo $! > /tmp/laburopro-next.pid
          for i in {1..30}; do
            if curl -fsS "$QA_BASE_URL" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/laburopro-next.log
          exit 1

      - name: HTTP smoke tests
        run: npm run qa:http

      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/laburopro-next.log || true

  authenticated-e2e:
    name: Authenticated provider and admin flows
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_TELEMETRY_DISABLED: '1'
      QA_BASE_URL: http://127.0.0.1:3100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify isolated QA environment
        shell: bash
        run: |
          for name in QA_SUPABASE_URL QA_SUPABASE_ANON_KEY QA_SUPABASE_SERVICE_ROLE_KEY QA_ADMIN_EMAIL QA_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done
          if [[ "$QA_SUPABASE_URL" == *"gxaqrwrqlwvgrjhmfhti"* ]]; then
            echo "Authenticated QA must never use the production Supabase project."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build against QA Supabase
        run: npm run build

      - name: Run authenticated E2E tests
        run: npm run qa:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
